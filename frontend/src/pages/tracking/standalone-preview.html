    function App() {
      const [viewState, setViewState] = useState('landing'); // 'landing' | 'loading' | 'results' | 'not_found'
      const [trackingNumber, setTrackingNumber] = useState('');
      const [parcel, setParcel] = useState(null);

      const performSearch = (code) => {
        const clean = (code || '').trim().toUpperCase();
        if (!clean) return;

        setTrackingNumber(clean);
        setViewState('loading');

        setTimeout(() => {
          const match = MOCK_PARCELS[clean];
          if (match) {
            setParcel(match);
            setViewState('results');
          } else {
            setParcel(null);
            setViewState('not_found');
          }
        }, 550);
      };

      const reset = () => {
        setViewState('landing');
        setTrackingNumber('');
        setParcel(null);
      };

      const steps = [
        PARCEL_STATUS.REGISTERED,
        PARCEL_STATUS.IN_TRANSIT,
        PARCEL_STATUS.ARRIVED,
        PARCEL_STATUS.COLLECTED,
      ];
      const currentStepIdx = parcel ? steps.indexOf(parcel.status) : 0;
      const currentMeta = parcel ? STATUS_METADATA[parcel.status] : null;

                  Track Parcel

                  Agencies
                </a>
              </nav>
            </div>
          </header>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-gutter-xl items-center">

                          Douala ↔ Bamenda Inter-City Corridor
                        </span>

                        </h1>
                        <p className="font-body text-body-lg text-on-surface-variant max-w-prose">
                          Stay informed about your delivery. Enter your tracking code below to check parcel status, timeline progress, and counter pickup notices.

                      </div>

                      {/* Search Card */}
                      <article className="bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm p-gutter-lg flex flex-col gap-gutter-md">

                  </div>
                </div>
              </section>
            )}

            {/* 2. LOADING SCREEN */}
            {viewState === 'loading' && (
              <section className="flex-1 flex items-center justify-center py-section px-page-margin">

                        </div>
                      </label>
                      <button type="submit" className="inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-3.5 rounded-md bg-secondary text-on-secondary font-label text-label-lg shadow-sm hover:bg-primary transition-colors cursor-pointer">
                        <span className="material-symbols-outlined text-title-lg">refresh</span>
                        <span>Try Again</span>
                      </button>
                    </div>
                  </form>
                  <button onClick={reset} className="text-sm font-label text-secondary hover:underline flex items-center gap-1 cursor-pointer">
                    <span className="material-symbols-outlined text-sm">arrow_back</span>
                    Return to Home
                  </button>
                </article>
              </section>
            )}

            {/* 4. RESULTS SCREEN */}
            {viewState === 'results' && parcel && (
              <section className="flex-1 py-gutter-xl">
                <div className="max-w-5xl mx-auto px-page-margin flex flex-col gap-gutter-lg">
                  {/* Top Bar */}
                  <div className="flex flex-col md:flex-row md:items-end justify-between gap-gutter-md">
                    <div className="flex flex-col gap-gutter-sm">
                      <div className="flex flex-wrap items-center gap-gutter-md">
                        <h1 className="font-headline text-headline-md sm:text-headline-lg text-primary">Tracking Results</h1>
                        <span className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full font-label text-label-md font-semibold ${currentMeta.bgBadge} ${currentMeta.textBadge}`}>
                          <span className="material-symbols-outlined text-body-md">{currentMeta.icon}</span>
                          <span>{currentMeta.label}</span>
                        </span>
                      </div>
                      <div className="flex flex-wrap items-center gap-gutter-sm text-on-surface-variant">
                        <span className="font-body text-body-md">Tracking Number:</span>
                        <span className="font-mono text-mono-md text-primary font-bold tabular-nums bg-surface-container-low px-2.5 py-0.5 rounded-sm border border-outline-variant">
                          {parcel.trackingNumber}
                        </span>
                        <span className="text-outline">·</span>
                        <span className="font-body text-body-md">{parcel.origin} ➔ {parcel.destination}</span>
                      </div>
                    </div>
                    <button onClick={reset} className="inline-flex items-center justify-center gap-gutter-sm px-gutter-md py-2.5 rounded-md bg-surface-container-lowest text-primary border border-outline-variant font-label text-label-md hover:bg-surface-container-low cursor-pointer shadow-sm">
                      <span className="material-symbols-outlined text-body-lg">search</span>
                      <span>Track Another Parcel</span>
                    </button>
                  </div>

                  {/* Arrival Banner if status === ARRIVED */}
                  {parcel.status === PARCEL_STATUS.ARRIVED && (
                    <aside className="rounded-lg bg-warning-container/40 border-2 border-warning p-gutter-lg flex flex-col md:flex-row items-start md:items-center justify-between gap-gutter-md shadow-sm">
                      <div className="flex items-start gap-3">
                        <div className="w-10 h-10 rounded-full bg-warning text-on-warning flex items-center justify-center shrink-0 mt-0.5">
                          <span className="material-symbols-outlined text-title-lg">notifications_active</span>
                        </div>
                        <div className="flex flex-col gap-1">
                          <span className="font-headline text-title-md text-on-warning-container font-bold">Parcel Ready for Counter Pickup!</span>
                          <p className="font-body text-body-sm text-on-warning-container">
                            Your parcel has arrived at <strong>{parcel.pickupBranch || parcel.destination}</strong>.
                            Please present your original National Identity Card (CNI) or receipt code at the agency counter.
                          </p>
                          <span className="text-xs font-mono text-on-warning-container/80">Counter Hours: {parcel.pickupHours}</span>
                        </div>
                      </div>
                    </aside>
                  )}

                  {/* Delivery Status Card */}
                  <article className="bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm p-gutter-lg flex flex-col sm:flex-row sm:items-center justify-between gap-gutter-md">
                    <div className="flex items-start sm:items-center gap-gutter-md">
                      <div className={`w-12 h-12 rounded-lg flex items-center justify-center shrink-0 ${currentMeta.bgBadge} ${currentMeta.colorText}`}>
                        <span className="material-symbols-outlined text-headline-md">{currentMeta.icon}</span>
                      </div>
                      <div className="flex flex-col gap-gutter-xs">
                        <span className="font-label text-label-sm uppercase tracking-wider text-secondary font-semibold">Current Delivery Status</span>
                        <h2 className="font-headline text-title-lg text-primary">{currentMeta.label}</h2>
                        <p className="font-body text-body-md text-on-surface-variant">{currentMeta.summaryDesc}</p>
                      </div>
                    </div>
                    <div className="flex flex-col sm:items-end gap-gutter-xs border-t sm:border-t-0 pt-gutter-md sm:pt-0 border-outline-variant shrink-0">
                      <span className="font-label text-label-sm text-on-surface-variant">Expected Arrival</span>
                      <span className="font-title text-title-md text-primary font-semibold">{parcel.expectedArrivalShort}</span>
                    </div>
                  </article>

                  {/* Details & Journey Timeline */}
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-gutter-lg items-start">
                    {/* Left: Parcel Information */}
                    <article className="lg:col-span-7 bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm p-gutter-lg flex flex-col gap-gutter-lg">
                      <header className="flex items-center justify-between border-b border-outline-variant pb-gutter-md">
                        <div className="flex flex-col gap-gutter-xs">
                          <h2 className="font-headline text-title-lg text-primary">Parcel Information</h2>
                          <p className="font-body text-body-sm text-on-surface-variant">Verified agency registration and route details</p>
                        </div>
                        <span className="material-symbols-outlined text-headline-md text-outline">package_2</span>
                      </header>
                      <dl className="grid grid-cols-1 sm:grid-cols-2 gap-x-gutter-lg gap-y-gutter-md">
                        <div className="flex flex-col gap-gutter-xs">
                          <dt className="font-label text-label-sm text-on-surface-variant">Tracking Number</dt>
                          <dd className="font-mono text-mono-md text-primary font-bold">{parcel.trackingNumber}</dd>
                        </div>
                        <div className="flex flex-col gap-gutter-xs">
                          <dt className="font-label text-label-sm text-on-surface-variant">Registration Date</dt>
                          <dd className="font-body text-body-md text-on-surface">{parcel.registrationDate}</dd>
                        </div>
                        <div className="flex flex-col gap-gutter-xs">
                          <dt className="font-label text-label-sm text-on-surface-variant">Sender</dt>
                          <dd className="font-title text-title-md text-on-surface">{parcel.senderName}</dd>
                        </div>
                        <div className="flex flex-col gap-gutter-xs">
                          <dt className="font-label text-label-sm text-on-surface-variant">Recipient</dt>
                          <dd className="font-title text-title-md text-on-surface">
                            {parcel.recipientName}
                            <span className="block text-xs font-mono text-on-surface-variant">{parcel.recipientPhone}</span>
                          </dd>
                        </div>
                        <div className="flex flex-col gap-gutter-xs">
                          <dt className="font-label text-label-sm text-on-surface-variant">Origin Agency</dt>
                          <dd className="font-body text-body-md text-on-surface flex items-center gap-1.5">
                            <span className="material-symbols-outlined text-body-lg text-primary">trip_origin</span>
                            <span>{parcel.origin}</span>
                          </dd>
                        </div>
                        <div className="flex flex-col gap-gutter-xs">
                          <dt className="font-label text-label-sm text-on-surface-variant">Destination Agency</dt>
                          <dd className="font-body text-body-md text-on-surface flex items-center gap-1.5">
                            <span className="material-symbols-outlined text-body-lg text-secondary">location_on</span>
                            <span>{parcel.destination}</span>
                          </dd>
                        </div>
                        <div className="flex flex-col gap-gutter-xs">
                          <dt className="font-label text-label-sm text-on-surface-variant">Weight & Type</dt>
                          <dd className="font-body text-body-md text-on-surface">{parcel.weightKg} kg · {parcel.packageType}</dd>
                        </div>
                        <div className="flex flex-col gap-gutter-xs sm:col-span-2 pt-gutter-sm border-t border-outline-variant">
                          <dt className="font-label text-label-sm text-on-surface-variant">Expected Arrival</dt>
                          <dd className="font-title text-title-md text-primary font-semibold">{parcel.expectedArrival}</dd>
                        </div>
                      </dl>
                    </article>

                    {/* Right: Journey Timeline */}
                    <article className="lg:col-span-5 bg-surface-container-lowest rounded-lg border border-outline-variant shadow-sm p-gutter-lg flex flex-col gap-gutter-lg">
                      <header className="flex flex-col gap-gutter-xs border-b border-outline-variant pb-gutter-md">
                        <h2 className="font-headline text-title-lg text-primary">Parcel Journey</h2>
                        <p className="font-body text-body-sm text-on-surface-variant">Step-by-step delivery milestones</p>
                      </header>

                      <ol className="flex flex-col" aria-label="Parcel delivery timeline">
                        {steps.map((st, idx) => {
                          const meta = STATUS_METADATA[st];
                          const isDone = idx < currentStepIdx;
                          const isCurrent = idx === currentStepIdx;
                          const isUpcoming = idx > currentStepIdx;
                          const isLast = idx === steps.length - 1;
                          const ev = (parcel.timeline || []).find(t => t.status === st);

                          return (
                            <li key={st} className={`relative flex gap-gutter-md ${!isLast ? 'pb-gutter-lg' : ''}`}>
                              <div className="flex flex-col items-center">
                                {isDone && (
                                  <div className="w-9 h-9 rounded-full bg-success text-on-primary flex items-center justify-center shrink-0 z-10 shadow-sm">
                                    <span className="material-symbols-outlined text-title-lg">check</span>
                                  </div>
                                )}
                                {isCurrent && (
                                  <div className="w-9 h-9 rounded-full bg-secondary text-on-secondary ring-4 ring-secondary-container flex items-center justify-center shrink-0 z-10 shadow-sm">
                                    <span className="material-symbols-outlined text-title-lg">{meta.icon}</span>
                                  </div>
                                )}
                                {isUpcoming && (
                                  <div className="w-9 h-9 rounded-full bg-surface-container-low border-2 border-outline-variant text-on-surface-variant flex items-center justify-center shrink-0 z-10">
                                    <span className="material-symbols-outlined text-title-lg text-outline">{meta.icon}</span>
                                  </div>
                                )}
                                {!isLast && (
                                  <div className={`w-0.5 flex-1 mt-1 ${isDone ? 'bg-success' : 'bg-outline-variant'}`}></div>
                                )}
                              </div>
                              <div className="flex flex-col gap-gutter-xs pt-1 flex-1">
                                <div className="flex items-center gap-gutter-sm flex-wrap">
                                  <span className={`font-label text-label-lg ${isCurrent ? 'text-secondary font-bold' : isDone ? 'text-primary font-semibold' : 'text-on-surface-variant'}`}>
                                    {meta.label}
                                  </span>
                                  {isDone && <span className="text-xs bg-success-container text-on-success-container px-2 py-0.5 rounded-full font-medium">Completed</span>}
                                  {isCurrent && <span className="text-xs bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-full font-semibold">Current</span>}
                                </div>
                                <p className={`font-body text-body-md ${isCurrent ? 'text-on-surface font-medium' : 'text-on-surface-variant'}`}>
                                  {ev ? ev.note : meta.timelineDesc}
                                </p>
                                {ev && ev.timestamp && (
                                  <time className={`font-mono text-mono-sm tabular-nums ${isCurrent ? 'text-secondary font-semibold' : 'text-on-surface-variant'}`}>
                                    {ev.timestamp}
                                  </time>
                                )}
                                {isUpcoming && (
                                  <span className="font-mono text-mono-sm text-outline italic">Pending</span>
                                )}
                              </div>
                            </li>
                          );
                        })}
                      </ol>
                    </article>
                  </div>

                  {/* Quick Try Another query */}
                  <div className="pt-4 border-t border-outline-variant flex flex-wrap items-center gap-2">
                    <span className="text-xs font-semibold uppercase text-on-surface-variant">Switch Demo ID:</span>
                    <button onClick={() => performSearch('PT-2026-001')} className="text-xs font-mono px-2 py-1 rounded bg-secondary-container text-on-secondary-container hover:bg-secondary hover:text-white cursor-pointer">PT-2026-001 (In Transit)</button>
                    <button onClick={() => performSearch('PT-DLA-BDA-001')} className="text-xs font-mono px-2 py-1 rounded bg-warning-container text-on-warning-container hover:bg-warning hover:text-white cursor-pointer">PT-DLA-BDA-001 (Arrived)</button>
                    <button onClick={() => performSearch('PT-DLA-BDA-002')} className="text-xs font-mono px-2 py-1 rounded bg-primary-container text-on-primary-container hover:bg-primary hover:text-white cursor-pointer">PT-DLA-BDA-002 (Registered)</button>
                    <button onClick={() => performSearch('PT-DLA-BDA-003')} className="text-xs font-mono px-2 py-1 rounded bg-success-container text-on-success-container hover:bg-success hover:text-white cursor-pointer">PT-DLA-BDA-003 (Collected)</button>
                    <button onClick={() => performSearch('PT-2026-999')} className="text-xs font-mono px-2 py-1 rounded bg-surface-container-low text-on-surface-variant hover:bg-outline-variant cursor-pointer">PT-2026-999 (Not Found)</button>
                  </div>
                </div>
              </section>
            )}
          </main>

          {/* Footer */}
          <footer className="bg-surface-container-lowest border-t border-outline-variant py-gutter-lg mt-auto">
            <div className="max-w-6xl mx-auto px-page-margin flex flex-col sm:flex-row items-center justify-between gap-gutter-md">
              <div className="flex items-center gap-gutter-sm text-on-surface-variant">
                <span className="font-title text-title-md text-primary font-semibold">ParcelTrack</span>
                <span className="font-body text-body-sm text-outline">·</span>
                <span className="font-body text-body-sm text-on-surface-variant">Public Customer Tracking Service</span>
              </div>
              <p className="font-body text-body-sm text-on-surface-variant text-center sm:text-right">
                © 2026 ParcelTrack. Douala ↔ Bamenda Inter-City Express. Need help? Visit your nearest transport agency.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
